# Ejemplo para un VPS con Nginx. Reemplazar dominio, rutas y certificados.
# Gunicorn debe escuchar solo en 127.0.0.1:8000.
server {
    listen 80;
    server_name martini.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name martini.example.com;

    ssl_certificate /etc/letsencrypt/live/martini.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/martini.example.com/privkey.pem;

    root /srv/martini-cell/frontend/dist;
    index index.html;
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /static/ {
        alias /srv/martini-cell/backend/staticfiles/;
    }

    # El volumen privado queda fuera de la raíz web y jamás se sirve aquí.
    location /private_media/ {
        return 404;
    }

    # Vue Router usa rutas internas como /panel y /ordenes/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
