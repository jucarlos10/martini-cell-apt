name: Pruebas del backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: martini_cell
          POSTGRES_USER: martini_app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U martini_app -d martini_cell"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: martini_cell
      DB_USER: martini_app
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: clave-solo-para-pruebas-automaticas
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements.txt
      - name: Ejecutar pruebas de Django
        working-directory: backend
        run: python manage.py test --noinput
