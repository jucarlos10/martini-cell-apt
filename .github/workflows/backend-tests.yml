name: Pruebas del backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: martini_cell
          POSTGRES_USER: martini_app
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U martini_app -d martini_cell"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: martini_cell
      DB_USER: martini_app
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: clave-solo-para-pruebas-automaticas
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-deploy.txt
      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements-deploy.txt
      - name: Verificar contrato CSV de HU-17 con datos sintéticos
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Verificar configuración de despliegue simulada
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: clave-exclusiva-de-verificacion-de-despliegue-no-usar-en-host-123456789
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_TRUST_X_FORWARDED_PROTO: "true"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy --fail-level ERROR
      - name: Ensayar comprobación previa del host
        env:
          DJANGO_ALLOWED_HOSTS: martini.test
          DJANGO_PRIVATE_MEDIA_ROOT: ${{ runner.temp }}/martini-media
        run: |
          mkdir -p "$DJANGO_PRIVATE_MEDIA_ROOT"
          python backend/manage.py migrate --noinput
          python backend/manage.py collectstatic --noinput
          python deploy/check_host.py
      - name: Ejecutar pruebas de Django
        working-directory: backend
        run: python manage.py test --noinput
